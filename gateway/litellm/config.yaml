model_list:
  # FreeLLMAPI is optional. Set FREELLMAPI_BASE_URL and FREELLMAPI_API_KEY.
  - model_name: freellmapi/auto
    litellm_params:
      model: openai/${FREELLMAPI_MODEL:-auto}
      api_base: os.environ/FREELLMAPI_BASE_URL
      api_key: os.environ/FREELLMAPI_API_KEY

  # NVIDIA NIM / hosted NVIDIA endpoints (OpenAI-compatible).
  - model_name: nvidia/fast
    litellm_params:
      model: openai/${NVIDIA_MODEL:-nvidia/llama-3.3-nemotron-super-49b-v1}
      api_base: os.environ/NVIDIA_BASE_URL
      api_key: os.environ/NVIDIA_API_KEY

  # OpenRouter is optional.
  - model_name: openrouter/auto
    litellm_params:
      model: openrouter/${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      api_key: os.environ/OPENROUTER_API_KEY

  # Local Ollama endpoint; no hosted API key required.
  - model_name: local/ollama
    litellm_params:
      model: ollama/${OLLAMA_MODEL:-qwen2.5-coder:7b}
      api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
