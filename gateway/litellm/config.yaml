model_list:
  # Each MODEL variable must include the LiteLLM provider prefix and upstream model ID.
  - model_name: freellmapi/auto
    litellm_params:
      model: os.environ/FREELLMAPI_MODEL
      api_base: os.environ/FREELLMAPI_BASE_URL
      api_key: os.environ/FREELLMAPI_API_KEY

  - model_name: nvidia/fast
    litellm_params:
      model: os.environ/NVIDIA_MODEL
      api_base: os.environ/NVIDIA_BASE_URL
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: openrouter/auto
    litellm_params:
      model: os.environ/OPENROUTER_MODEL
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: local/ollama
    litellm_params:
      model: os.environ/OLLAMA_MODEL
      api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
